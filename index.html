<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisor Coverage Calendar</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f6f9;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #2c3e50;
        }

        .calendar {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #eaeaea;
        }

        th {
            background-color: #34495e;
            color: white;
            text-transform: uppercase;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .off {
            color: #e74c3c;
            font-weight: bold;
        }

        .covering {
            color: #27ae60;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Weekly Supervisor Coverage</h1>
    <div class="calendar">
        <table>
            <thead>
                <tr>
                    <th>Day</th>
                    <th>Supervisor Off</th>
                    <th>Manager Covering</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Monday</td>
                    <td class="off">Chris (3rd Shift)</td>
                    <td class="covering">Miguel</td>
                </tr>
                <tr>
                    <td>Tuesday</td>
                    <td class="off">Ben (1st Shift)</td>
                    <td class="covering">Miguel</td>
                </tr>
                <tr>
                    <td>Wednesday</td>
                    <td class="off">Deunte (2nd Shift)</td>
                    <td class="covering">Miguel</td>
                </tr>
                <tr>
                    <td>Thursday</td>
                    <td class="off">None</td>
                    <td class="covering">—</td>
                </tr>
                <tr>
                    <td>Friday</td>
                    <td class="off">None</td>
                    <td class="covering">—</td>
                </tr>
                <tr>
                    <td>Saturday</td>
                    <td colspan="2">All Off</td>
                </tr>
                <tr>
                    <td>Sunday</td>
                    <td colspan="2">All Off</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
